# Local dev for ZoidLab VisionLab (Foundry Package 10).
#   docker compose up --build
# Self-contained: Postgres comes up first and ./initdb.sql creates the RLS roles
# (foundry owns the schema, app_rls is the NOBYPASSRLS role every request runs as),
# then the backend opens its psycopg pool against it at import. Point
# DATABASE_URL / DATABASE_URL_ADMIN elsewhere to use the shared Foundry Postgres.
services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app_rls:app_rls@postgres:5432/visionlab}
      - DATABASE_URL_ADMIN=${DATABASE_URL_ADMIN:-postgresql://foundry:foundry@postgres:5432/visionlab}
      - BUILDER_SESSION_SECRET=${BUILDER_SESSION_SECRET:-change-me}
      - NYQUEST_API_KEY=${NYQUEST_API_KEY:-}
      - FOUNDRY_GATE_ENABLED=${FOUNDRY_GATE_ENABLED:-true}
      - FOUNDRY_REQUIRED_PLAN=${FOUNDRY_REQUIRED_PLAN:-pro}
      - MOCK_PRO_USER=${MOCK_PRO_USER:-false}
      - FOUNDRY_INTEGRATION=${FOUNDRY_INTEGRATION:-false}
      - SPENDGUARD_URL=${SPENDGUARD_URL:-}
      - TRUSTGATE_URL=${TRUSTGATE_URL:-}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-foundry}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-foundry-secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-visionlab-assets}
      - MINIO_SECURE=false
    ports:
      - "8704:8704"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Same image as the backend; durable jobs execute here, not in the API process.
  worker:
    build: ./backend
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app_rls:app_rls@postgres:5432/visionlab}
      - DATABASE_URL_ADMIN=${DATABASE_URL_ADMIN:-postgresql://foundry:foundry@postgres:5432/visionlab}
      - BUILDER_SESSION_SECRET=${BUILDER_SESSION_SECRET:-change-me}
      - NYQUEST_API_KEY=${NYQUEST_API_KEY:-}
      - FOUNDRY_GATE_ENABLED=${FOUNDRY_GATE_ENABLED:-true}
      - FOUNDRY_REQUIRED_PLAN=${FOUNDRY_REQUIRED_PLAN:-pro}
      - MOCK_PRO_USER=${MOCK_PRO_USER:-false}
      - FOUNDRY_INTEGRATION=${FOUNDRY_INTEGRATION:-false}
      - SPENDGUARD_URL=${SPENDGUARD_URL:-}
      - TRUSTGATE_URL=${TRUSTGATE_URL:-}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-foundry}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-foundry-secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-visionlab-assets}
      - MINIO_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - VISIONLAB_API_URL=http://backend:8704
      - BUILDER_SESSION_SECRET=${BUILDER_SESSION_SECRET:-change-me}
      - NYQUEST_API=${NYQUEST_API:-https://api.nyquest.ai}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-.zoidlab.ai}
    ports:
      - "3704:3704"
    depends_on:
      - backend

  # Not published to the host: the backend reaches it over the compose network, so
  # `docker compose up` never collides with a Postgres already running locally.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=foundry
      - POSTGRES_PASSWORD=foundry
      - POSTGRES_DB=visionlab
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/10-foundry-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U foundry -d visionlab"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Image bytes live here (backend/storage.py), never in Postgres.
  minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-foundry}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-foundry-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
  minio_data:
